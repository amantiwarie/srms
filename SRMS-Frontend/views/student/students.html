<div class="card p-4">

    <h3>All Students</h3>

    <table class="table table-bordered">

        <thead>

        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Age</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr ng-repeat="s in students">

            <td>{{s.id}}</td>
            <td>{{s.name}}</td>
            <td>{{s.userName}}</td>
            <td>{{s.email}}</td>
            <td>{{s.age}}</td>

            <td>

                <button
                        class="btn btn-warning btn-sm"
                        ng-click="editStudent(s.id)">
                    Edit
                </button>

                <button
                        class="btn btn-danger btn-sm"
                        ng-click="deleteStudent(s.id)">
                    Delete
                </button>

            </td>

        </tr>

        </tbody>

    </table>

</div>
