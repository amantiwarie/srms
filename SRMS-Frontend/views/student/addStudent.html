<div class="alert alert-danger"
     ng-if="errorMessages.length">

    <ul>

        <li ng-repeat="error in errorMessages">

            {{error}}

        </li>

    </ul>

</div>

<div class="card p-4">


    <h3>Add Student</h3>

    <form ng-submit="addStudent()">

        <div class="mb-3">
            <label>Name</label>
            <input type="text"
                   ng-model="student.name"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Username</label>
            <input type="text"
                   ng-model="student.userName"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   ng-model="student.email"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Age</label>
            <input type="number"
                   ng-model="student.age"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   ng-model="student.password"
                   class="form-control"
                   required
                   minlength="6">
        </div>

        <button class="btn btn-success">
            Save Student
        </button>

    </form>

</div>
